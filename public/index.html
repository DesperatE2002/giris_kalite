<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-LAB Süreç Kontrol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* ═══════ THEME SYSTEM ═══════ */
    :root, [data-theme="dark"] {
      --bg-primary: #0a0e1a;
      --bg-secondary: #111827;
      --bg-card: rgba(17, 24, 39, 0.85);
      --bg-card-hover: rgba(30, 41, 59, 0.9);
      --border-color: rgba(99, 102, 241, 0.15);
      --border-hover: rgba(99, 102, 241, 0.35);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-primary: #6366f1;
      --accent-secondary: #8b5cf6;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --input-bg: rgba(31, 41, 55, 0.5);
      --input-border: rgba(255, 255, 255, 0.1);
      --scrollbar-track: rgba(15, 23, 42, 0.5);
      --table-hover: rgba(99, 102, 241, 0.04);
      --loading-bg: #0a0e1a;
    }

    [data-theme="light"] {
      --bg-primary: #f0f2f5;
      --bg-secondary: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.92);
      --bg-card-hover: rgba(241, 245, 249, 0.95);
      --border-color: rgba(99, 102, 241, 0.18);
      --border-hover: rgba(99, 102, 241, 0.4);
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent-primary: #6366f1;
      --accent-secondary: #8b5cf6;
      --accent-glow: rgba(99, 102, 241, 0.18);
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --input-bg: rgba(241, 245, 249, 0.8);
      --input-border: rgba(99, 102, 241, 0.2);
      --scrollbar-track: rgba(226, 232, 240, 0.8);
      --table-hover: rgba(99, 102, 241, 0.06);
      --loading-bg: #f0f2f5;
    }

    body {
      background: var(--bg-primary);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--text-primary);
      transition: background 0.3s ease, color 0.3s ease;
    }
    [data-theme="dark"] body, :root body {
      background-image: 
        radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(59, 130, 246, 0.04) 0%, transparent 50%);
    }
    [data-theme="light"] body {
      background-image: 
        radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.04) 0%, transparent 50%);
    }
    
    /* Glass Card */
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    [data-theme="dark"] .glass-card, :root .glass-card {
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.03);
    }
    [data-theme="light"] .glass-card {
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
    }
    .glass-card:hover {
      border-color: var(--border-hover);
    }
    
    /* Gradient Buttons */
    .gradient-btn {
      background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
      background-size: 200% auto;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px var(--accent-glow);
    }
    .gradient-btn:hover {
      background-position: right center;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px var(--accent-glow);
    }
    
    /* Pulse */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-slow {
      animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    /* Fade In */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeIn 0.4s ease-out;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }
    
    /* Spinner */
    .spinner {
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top: 3px solid var(--accent-primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    /* Hover Lift */
    .hover-lift {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hover-lift:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      border-color: var(--border-hover);
    }
    
    /* Gradient Text */
    .gradient-text {
      background: linear-gradient(135deg, #818cf8 0%, #a78bfa 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Mobile table */
    @media (max-width: 768px) {
      .mobile-card { display: block; }
      .mobile-card td { display: block; text-align: right; padding: 8px; }
      .mobile-card td:before { content: attr(data-label); float: left; font-weight: bold; }
    }

    /* Nav sidebar active state */
    .nav-btn {
      color: var(--text-secondary);
      transition: all 0.2s ease;
    }
    .nav-btn:hover {
      color: var(--text-primary);
      background: rgba(99, 102, 241, 0.08);
    }
    .nav-btn.active-nav {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: white;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    /* Table styles */
    table th { color: var(--text-secondary); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
    table td { color: var(--text-primary); border-color: var(--border-color); }
    table tr:hover td { background: var(--table-hover); }

    /* Input fields */
    input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
    select, textarea {
      background: var(--input-bg) !important;
      border-color: var(--input-border) !important;
      color: var(--text-primary) !important;
    }
    [data-theme="dark"] input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
    [data-theme="dark"] select, [data-theme="dark"] textarea,
    :root input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
    :root select, :root textarea {
      color-scheme: dark;
    }
    [data-theme="light"] input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
    [data-theme="light"] select, [data-theme="light"] textarea {
      color-scheme: light;
    }

    /* Status indicator glow */
    .status-glow { box-shadow: 0 0 8px currentColor; }

    /* Light theme text/icon overrides */
    [data-theme="light"] .text-white { color: var(--text-primary) !important; }
    [data-theme="light"] .text-gray-300, [data-theme="light"] .text-gray-200 { color: var(--text-secondary) !important; }
    [data-theme="light"] .text-gray-400, [data-theme="light"] .text-gray-500 { color: var(--text-muted) !important; }
    [data-theme="light"] .bg-gray-800\/50, [data-theme="light"] .bg-gray-800 { background: var(--input-bg) !important; }
    [data-theme="light"] .border-white\/10, [data-theme="light"] .border-white\/5 { border-color: var(--border-color) !important; }
    [data-theme="light"] .bg-white\/5, [data-theme="light"] .bg-white\/\[0\.02\] { background: rgba(99,102,241,0.04) !important; }
    [data-theme="light"] .divide-white\/\[0\.03\] > :not(:last-child) { border-color: var(--border-color) !important; }
    [data-theme="light"] .gradient-text {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #9333ea 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    [data-theme="light"] .hover-lift:hover {
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
    }
    [data-theme="light"] #loadingScreen { background: var(--loading-bg) !important; }
    [data-theme="light"] .bg-\[\#0a0e1a\] { background: var(--bg-primary) !important; }

    /* Theme toggle switch */
    .theme-switch { position: relative; width: 52px; height: 28px; }
    .theme-switch input { opacity: 0; width: 0; height: 0; }
    .theme-slider {
      position: absolute; cursor: pointer; inset: 0;
      background: #334155; border-radius: 28px;
      transition: 0.3s;
    }
    .theme-slider:before {
      content: ''; position: absolute;
      height: 22px; width: 22px;
      left: 3px; bottom: 3px;
      background: white; border-radius: 50%;
      transition: 0.3s;
    }
    .theme-switch input:checked + .theme-slider { background: var(--accent-primary); }
    .theme-switch input:checked + .theme-slider:before { transform: translateX(24px); }
  </style>
</head>
<body class="bg-[#0a0e1a]">
  <script>
    // Theme init — localStorage'dan yükle (FOUC engelle)
    (function() {
      const saved = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
    })();
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      const toggle = document.getElementById('themeToggle');
      if (toggle) toggle.checked = (next === 'dark');
    }
    // Set toggle state after DOM ready
    document.addEventListener('DOMContentLoaded', () => {
      const toggle = document.getElementById('themeToggle');
      if (toggle) toggle.checked = (localStorage.getItem('theme') || 'dark') === 'dark';
    });
  </script>
  
  <!-- Loading Screen -->
  <div id="loadingScreen" class="fixed inset-0 bg-[#0a0e1a] z-50 flex items-center justify-center hidden">
    <div class="text-center">
      <div class="spinner mx-auto mb-4"></div>
      <p class="text-gray-400">Yükleniyor...</p>
    </div>
  </div>

        </div>

        <p class="mt-2 text-gray-400 text-lg">Sisteme giriş yapın</p>
      </div>
      <form id="loginForm" class="mt-8 space-y-6 glass-card p-8 rounded-2xl">

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">
              <i class="fas fa-user mr-2 text-indigo-400"></i>Kullanıcı Adı
            </label>
            <input type="text" id="username" required

              placeholder="Kullanıcı adınızı girin">

          <div>

            <input type="password" id="password" required

              placeholder="Şifrenizi girin">

        </div>
        <div id="loginError" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-lg"></div>
        <button type="submit" 
          class="w-full flex justify-center py-3 px-4 border-0 text-lg font-semibold rounded-xl text-white gradient-btn shadow-lg">
          <i class="fas fa-sign-in-alt mr-2 mt-1"></i> Giriş Yap
        </button>
        <div class="text-center mt-4">
          <button type="button" id="showRegisterBtn" class="text-indigo-400 hover:text-indigo-300 font-semibold transition-colors">
            Hesabınız yok mu? Kayıt olun
          </button>
        </div>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="mt-8 space-y-6 glass-card p-8 rounded-2xl hidden">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">
              <i class="fas fa-user-circle mr-2 text-indigo-400"></i>Ad Soyad
            </label>
            <input type="text" id="registerFullName" required 
              class="appearance-none relative block w-full px-4 py-3 border border-white/10 placeholder-gray-500 text-white bg-gray-800/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
              placeholder="Ad ve soyadınızı girin">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2"><i class="fas fa-user mr-2 text-indigo-400"></i>Kullanıcı Adı</label>
            <input type="text" id="registerUsername" required 
              class="appearance-none relative block w-full px-4 py-3 border border-white/10 placeholder-gray-500 text-white bg-gray-800/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
              placeholder="Kullanıcı adınızı girin">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2"><i class="fas fa-lock mr-2 text-indigo-400"></i>Şifre</label>
            <input type="password" id="registerPassword" required minlength="6"
              class="appearance-none relative block w-full px-4 py-3 border border-white/10 placeholder-gray-500 text-white bg-gray-800/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
              placeholder="En az 6 karakter">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2"><i class="fas fa-lock mr-2 text-indigo-400"></i>Şifre Tekrar</label>
            <input type="password" id="registerPasswordConfirm" required minlength="6"
              class="appearance-none relative block w-full px-4 py-3 border border-white/10 placeholder-gray-500 text-white bg-gray-800/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
              placeholder="Şifrenizi tekrar girin">
          </div>
        </div>
        <div id="registerError" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-lg"></div>
        <div id="registerSuccess" class="hidden bg-green-500/10 border border-green-500/30 text-green-400 px-4 py-3 rounded-lg"></div>
        <button type="submit" 
          class="w-full flex justify-center py-3 px-4 border-0 text-lg font-semibold rounded-xl text-white bg-emerald-600 hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition shadow-lg">
          <i class="fas fa-user-plus mr-2 mt-1"></i> Kayıt Ol
        </button>
        <div class="text-center mt-4">
          <button type="button" id="showLoginBtn" class="text-indigo-400 hover:text-indigo-300 font-semibold transition-colors">
            Zaten hesabınız var mı? Giriş yapın
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Main App -->
  <div id="mainApp" class="hidden">

          </button>
          <button data-page="technicians" class="nav-btn w-full group flex items-center px-4 py-3 text-sm font-semibold rounded-xl transition-all">
            <i class="fas fa-hard-hat mr-3 text-base w-5 text-center"></i> İş Takip

          <button data-page="taskboard" class="nav-btn w-full group flex items-center px-4 py-3 text-sm font-semibold rounded-xl transition-all">
